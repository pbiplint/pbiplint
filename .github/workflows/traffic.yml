name: Archive traffic

# GitHub keeps a repository's views, clones, referrers, and popular paths for 14 days. Once a week
# this saves them to traffic.json on the metrics branch, merged by date, so they last. See "Usage
# counts" in CONTRIBUTING.md. Nothing here touches the site: it counts from GitHub's side only.

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays, 06:00 UTC
  workflow_dispatch:

permissions: {}

concurrency:
  group: traffic
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # pushes traffic.json to the metrics branch
    steps:
      # Pinned to a commit, as release.yml pins its third-party step, since this job can push.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The metrics branch holds only the archive. The repository is public, so reading it needs no
      # token. ls-remote exits 2 when the branch is missing, and only then does this start it as an
      # orphan; any other failure stops the run.
      - name: Check out the metrics branch
        env:
          REPO: ${{ github.repository }}
        run: |
          remote="https://github.com/${REPO}.git"
          set +e
          git ls-remote --exit-code --heads "$remote" metrics >/dev/null
          found=$?
          set -e
          if [ "$found" -eq 0 ]; then
            git clone --quiet --depth 1 --branch metrics "$remote" metrics
          elif [ "$found" -eq 2 ]; then
            git init --quiet -b metrics metrics
            git -C metrics remote add origin "$remote"
            printf '%s\n' "# metrics" "" "traffic.json: this repository's GitHub traffic, saved weekly by .github/workflows/traffic.yml on main. See \"Usage counts\" in CONTRIBUTING.md." > metrics/README.md
          else
            exit "$found"
          fi
      # The built-in token cannot read traffic, so this step alone gets the read-only secret.
      - name: Fetch and merge
        id: merge
        env:
          TRAFFIC_TOKEN: ${{ secrets.TRAFFIC_TOKEN }}
        run: node scripts/traffic.mjs metrics/traffic.json
      # The job's token reaches git only here, as a header on the push, and is never written to disk.
      - name: Commit and push
        if: steps.merge.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd metrics
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md traffic.json
          git commit --quiet -m "traffic: $(date -u +%F)"
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c http.extraheader="AUTHORIZATION: basic $auth" push --quiet origin metrics
