name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run check:browser
      - run: npm run build
      - run: npm run check:pack
      - run: npm run test:bundle -w pbiplint
      # The alias reaches into pbiplint's dist by path, which resolves only while pbiplint
      # declares no exports map. A unit test pins that, and this proves the shim actually runs.
      - run: npm run test:bundle -w pbip-lint
  # The site in real browsers: the production build served by vite preview, driven by Playwright in
  # Chromium, Firefox, and WebKit, with an accessibility scan. Its own job, so the matrix above
  # stays quick and a browser download never slows the unit tests.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: packages/web/playwright-report
          retention-days: 7
