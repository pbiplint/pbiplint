name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build -w @pbiplint/web
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: packages/web/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
  # Every page is stamped with the short commit sha at build time (packages/web/src/build/build-info.ts),
  # so the live site can prove it is serving the build this run published. Pages purges its edge on
  # deploy and a new build has shown within a minute, so three minutes of retries is generous; the
  # request asks for a fresh copy in case something in between honours the ten-minute cache header.
  # A red verify beside a green deploy is deliberate: the site is up, but not with this run's build.
  # The timeouts matter: a hung request here would hold the pages concurrency group and block every
  # later deploy.
  verify:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: {}
    steps:
      - name: Confirm pbiplint.com serves this build
        env:
          SHA: ${{ github.sha }}
        run: |
          marker="name=\"pbiplint-build\" content=\"${SHA:0:7}\""
          for attempt in $(seq 1 18); do
            ok=true
            for path in / /rules/ /about/; do
              curl -fsS --max-time 15 -H 'Cache-Control: no-cache' "https://pbiplint.com${path}" | grep -qF "$marker" || ok=false
            done
            if [ "$ok" = true ]; then
              echo "pbiplint.com serves ${SHA:0:7}"
              exit 0
            fi
            sleep 10
          done
          echo "pbiplint.com is not serving ${SHA:0:7} after three minutes"
          exit 1
