# Contributor license agreement check. The agreement is CLA.md on main.
#
# A first-time contributor is asked to sign by posting the sentence from
# CLA.md section 8 as a pull request comment. The signature is recorded in
# signatures/version1/cla.json on the cla-signatures branch, which nothing
# else writes to. This workflow never checks out pull request code, which is
# what makes pull_request_target safe to run here with a write token.
name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    if: github.event_name == 'pull_request_target' || github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'
    runs-on: ubuntu-latest
    steps:
      - name: CLA Assistant
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: https://github.com/pbiplint/pbiplint/blob/main/CLA.md
          path-to-signatures: signatures/version1/cla.json
          branch: cla-signatures
          # Maintainer accounts and bots never need to sign.
          allowlist: TheDataPractitioner,michaelmckinleyconsulting,michaellmckinley,dependabot[bot],github-actions[bot],bot*
          lock-pullrequest-aftermerge: false
