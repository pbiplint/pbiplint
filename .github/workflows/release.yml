name: Release

on:
  push:
    tags: ["v*"]

# Nothing here: each job asks for exactly what it needs, so the job that runs the test suite never
# holds the OIDC token the publish authenticates with.
permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Pinned to the SHA that triggered the run, because a tag is mutable and checkout resolves a
      # tag ref at fetch time: without the pin this job could verify a different commit from the
      # one the publish job ships. That job pins for the same reason. persist-credentials: false,
      # so no git credential is left in .git/config for the steps that follow. Nothing here pushes.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node scripts/check-release-tag.mjs "$GITHUB_REF_NAME"
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run check:browser
      - run: npm run build
      - run: npm run check:network
      - run: npm run check:pack

  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write # softprops/action-gh-release creates the release
      id-token: write # npm trusted publishing, and signing the site archive's attestation
      attestations: write # the site archive's build provenance attestation
    steps:
      # Pinned to the SHA that triggered the run, because a tag is mutable: resolving the tag ref a
      # second time here could publish a commit the verify job never saw. persist-credentials:
      # false, so no git credential is left in .git/config; nothing in this job pushes either.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      # Trusted publishing needs npm 11.5.1 or later; Node 22 ships an older npm.
      # npm@11 resolves to the newest 11.x, which satisfies that, and pins the major.
      - run: npm install -g npm@11
      - run: npm ci --ignore-scripts
      - run: npm run build
      # Run again on this job's own tree rather than trusting the verify job's: this is the
      # tarball that ships.
      - run: npm run check:network
      - run: npm run check:pack
      # The site archive for firms that host pbiplint themselves (issue #93): the self-hosting
      # build of this same commit, the egress check, and SHA256SUMS over both, with a build
      # provenance attestation a firm checks with `gh attestation verify`. Built before anything
      # reaches npm, so a failure here publishes nothing; publish.mjs skips what is already on
      # the registry, so the job stays safe to rerun.
      - run: npm run build -w @pbiplint/web -- --mode self-host
      - run: node scripts/site-archive.mjs release-files
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            release-files/pbiplint-site-*.zip
            release-files/pbiplint-egress-check-*.mjs
      - run: node scripts/publish.mjs
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          generate_release_notes: true
          files: release-files/*
