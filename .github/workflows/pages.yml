name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build -w @pbiplint/web
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: packages/web/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
  # Every page is stamped with the short commit sha at build time (packages/web/src/build/build-info.ts),
  # so the live site can prove it is serving the build this run published. Pages sets a ten-minute
  # cache header, so the check retries for up to three minutes before calling the deploy a failure.
  verify:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Confirm pbiplint.com serves this build
        env:
          SHA: ${{ github.sha }}
        run: |
          marker="name=\"pbiplint-build\" content=\"${SHA:0:7}\""
          for attempt in $(seq 1 18); do
            ok=true
            for path in / /rules/hide-foreign-keys/ /about/; do
              curl -fsS "https://pbiplint.com${path}" | grep -q "$marker" || ok=false
            done
            if [ "$ok" = true ]; then
              echo "pbiplint.com serves ${SHA:0:7}"
              exit 0
            fi
            sleep 10
          done
          echo "pbiplint.com is not serving ${SHA:0:7} after three minutes"
          exit 1
